name: Build validated GODSEYE v4.26 replacement ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_remote_access_api_helper.py'
      - '.github/workflows/fix-v426-remote-api-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Apply idempotent Remote Access repair
        run: python .github/scripts/fix_remote_access_api_helper.py
      - name: Verify application compiles
        run: python -m compileall -q app
      - name: Run Remote Access regression
        run: PYTHONPATH=. python -m pytest -q tests/test_v426_remote_access_api_helper.py
      - name: Commit corrected source before packaging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py tests/test_v426_remote_access_api_helper.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Remote Access API helper permanently [skip ci]'
          fi
      - name: Build replacement ZIP
        run: |
          rm -rf /tmp/godseye-v426-stage
          mkdir -p /tmp/godseye-v426-stage
          git archive --format=tar HEAD | tar -x -C /tmp/godseye-v426-stage
          cp app/main.py /tmp/godseye-v426-stage/app/main.py
          cp tests/test_v426_remote_access_api_helper.py /tmp/godseye-v426-stage/tests/test_v426_remote_access_api_helper.py
          (cd /tmp/godseye-v426-stage && zip -qr "$GITHUB_WORKSPACE/GODSEYE-v4.26.0-replacement.zip" .)
          sha256sum GODSEYE-v4.26.0-replacement.zip | awk '{print toupper($1)}' > GODSEYE-v4.26.0-replacement.zip.sha256
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('GODSEYE-v4.26.0-replacement.zip')
          text=z.read('app/main.py').decode()
          start=text.index('async function loadRemoteAccess(){')
          end=text.index('\n(function(){', start)
          block=text[start:end]
          assert "api('/api/v1/" not in block
          assert 'api(`/api/v1/' not in block
          assert "await json('/api/v1/windows-agents')" in block
          assert z.read('VERSION').decode().strip() == '4.26.0'
          print('Replacement ZIP content verified.')
          PY
      - name: Upload replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-v4.26.0-replacement
          path: |
            GODSEYE-v4.26.0-replacement.zip
            GODSEYE-v4.26.0-replacement.zip.sha256
          retention-days: 90
      - name: Push corrected source
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
