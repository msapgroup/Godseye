name: Build GODSEYE Windows Agent x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
  pull_request:
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read agent version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Windows Agent version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained x64 service
        shell: pwsh
        run: |
          $project = 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $publish = 'windows/agent-x64/publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $publish 'GODSEYE.Agent.exe'
          if (-not (Test-Path $exe)) { throw 'Publish did not create GODSEYE.Agent.exe.' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw ('GODSEYE.Agent.exe is not x64; PE machine=0x{0:X4}' -f $machine) }

      - name: Build canonical x64 MSI
        shell: pwsh
        run: |
          dotnet build 'windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj' -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built = Get-ChildItem 'windows/agent-x64/installer/msi/bin' -Filter 'GODSEYE-Windows-Agent-x64.msi' -Recurse | Select-Object -First 1
          if (-not $built) { throw 'WiX did not create GODSEYE-Windows-Agent-x64.msi.' }
          $msi = 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi'
          Copy-Item $built.FullName $msi -Force
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content "$msi.sha256" $hash -Encoding ascii

      - name: Smoke-test Windows Installer lifecycle
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'godseye-msi-install.log'
          $repairLog = Join-Path $env:RUNNER_TEMP 'godseye-msi-repair.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'godseye-msi-uninstall.log'

          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) { Get-Content $installLog -Tail 200; throw "MSI install failed: $($install.ExitCode)" }

          $service = Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $service) { throw 'MSI did not create GODSEYEWindowsAgent.' }
          if ($service.StartMode -ne 'Auto') { throw "Service start mode is $($service.StartMode), expected Auto." }
          if ($service.StartName -ne 'LocalSystem') { throw "Service account is $($service.StartName), expected LocalSystem." }
          if ($service.PathName -notlike '*\GODSEYE Agent\GODSEYE.Agent.exe*') { throw "Unexpected service path: $($service.PathName)" }
          $trayRun = (Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'GODSEYE Windows Agent' -ErrorAction Stop).'GODSEYE Windows Agent'
          if ($trayRun -notmatch 'GODSEYE.Agent.exe.*--tray') { throw "Tray sign-in registration is invalid: $trayRun" }

          $sentinel = Join-Path $env:ProgramData 'GODSEYE\Agent\ci-preserve-test.txt'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content $sentinel 'preserve-me' -Encoding ascii

          $repair = Start-Process msiexec.exe -ArgumentList @('/fa', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$repairLog`"") -Wait -PassThru
          if ($repair.ExitCode -notin 0,3010) { Get-Content $repairLog -Tail 200; throw "MSI repair failed: $($repair.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'MSI repair removed ProgramData state.' }

          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") -Wait -PassThru
          if ($uninstall.ExitCode -notin 0,3010) { Get-Content $uninstallLog -Tail 200; throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          if (Get-Service GODSEYEWindowsAgent -ErrorAction SilentlyContinue) { throw 'Windows service remains after uninstall.' }
          if (Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'GODSEYE Windows Agent' -ErrorAction SilentlyContinue) { throw 'Tray sign-in registration remains after uninstall.' }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall removed persistent ProgramData state.' }
          Remove-Item $sentinel -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found.' }

      - name: Build guided Setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'windows/agent-x64/installer/GODSEYE-Agent-x64.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = 'windows/agent-x64/installer/output/GODSEYE-Windows-Agent-x64-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Guided Setup EXE was not created.' }
          Copy-Item 'windows/agent-x64/publish/GODSEYE.Agent.exe' 'windows/agent-x64/GODSEYE.Agent.exe' -Force
          Copy-Item $setup 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe' -Force
          $hash = (Get-FileHash 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256' $hash -Encoding ascii

      - name: Build release manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "windows-agent-v$version"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $msi = 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi'
          $setup = 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe'
          $manifest = [ordered]@{
            version = $version
            filename = 'GODSEYE-Windows-Agent-x64.msi'
            sha256 = (Get-FileHash $msi -Algorithm SHA256).Hash.ToUpperInvariant()
            url = "$base/GODSEYE-Windows-Agent-x64.msi"
            setup_filename = 'GODSEYE-Windows-Agent-x64-Setup.exe'
            setup_sha256 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToUpperInvariant()
            setup_url = "$base/GODSEYE-Windows-Agent-x64-Setup.exe"
          } | ConvertTo-Json
          Set-Content 'windows/agent-x64/update-manifest.json' $manifest -Encoding utf8

      - name: Validate package naming and hashes
        shell: pwsh
        run: |
          $manifest = Get-Content 'windows/agent-x64/update-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.filename -ne 'GODSEYE-Windows-Agent-x64.msi') { throw 'Manifest filename is not canonical.' }
          if ($manifest.setup_filename -ne 'GODSEYE-Windows-Agent-x64-Setup.exe') { throw 'Manifest setup filename is not canonical.' }
          $actualMsi = (Get-FileHash ('windows/agent-x64/' + $manifest.filename) -Algorithm SHA256).Hash.ToUpperInvariant()
          $actualSetup = (Get-FileHash ('windows/agent-x64/' + $manifest.setup_filename) -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualMsi -ne $manifest.sha256) { throw 'Manifest MSI hash mismatch.' }
          if ($actualSetup -ne $manifest.setup_sha256) { throw 'Manifest Setup hash mismatch.' }
          $expectedPrefix = "https://github.com/${{ github.repository }}/releases/download/windows-agent-v$($manifest.version)/"
          if (-not $manifest.url.StartsWith($expectedPrefix)) { throw 'Manifest MSI release URL is unexpected.' }
          if (-not $manifest.setup_url.StartsWith($expectedPrefix)) { throw 'Manifest Setup release URL is unexpected.' }

      - name: Upload Windows Agent x64 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Windows-Agent-x64-${{ steps.version.outputs.version }}
          path: |
            windows/agent-x64/GODSEYE.Agent.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256
            windows/agent-x64/update-manifest.json

      - name: Publish Windows Agent release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "windows-agent-v$version"
          $repo = '${{ github.repository }}'
          $assets = @(
            'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256',
            'windows/agent-x64/update-manifest.json'
          )

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $repo
          } else {
            gh release create $tag @assets --repo $repo --title "GODSEYE Windows Agent x64 $version" --notes "Stable x64 Windows Agent release. The agent version is independent from the GODSEYE server version. Use the guided Setup EXE for interactive installs or the MSI for managed deployment and self-update."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the Windows Agent GitHub Release failed.' }

      - name: Refresh release manifest on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # Large packages live in GitHub Releases, not Git history.
          # Generated packages are ignored in Git and published as verified assets.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $releaseManifest = Get-Content 'RELEASE_MANIFEST.json' -Raw | ConvertFrom-Json
          $releaseManifest.windows_agent.version = '${{ steps.version.outputs.version }}'
          $releaseManifest | ConvertTo-Json -Depth 8 | Set-Content 'RELEASE_MANIFEST.json' -Encoding utf8
          git add RELEASE_MANIFEST.json
          git add windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
          git add windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256
          git add windows/agent-x64/update-manifest.json
          if (git diff --cached --quiet) { Write-Host 'Release manifest is already current.'; exit 0 }
          git commit -m 'Refresh Windows Agent x64 ${{ steps.version.outputs.version }} release manifest [skip ci]'
          git push origin HEAD:main
