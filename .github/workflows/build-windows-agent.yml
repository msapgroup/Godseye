name: Build GODSEYE Windows Agent x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
  pull_request:
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read independent agent version
        shell: pwsh
        run: |
          [xml]$p=Get-Content 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $v=[string]$p.Project.PropertyGroup.Version
          if (-not $v) { throw 'Agent version missing.' }
          "AGENT_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish precompiled self-contained x64 agent
        shell: pwsh
        run: |
          $publish='windows/agent-x64/publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          dotnet publish 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj' -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe="$publish/GODSEYE.Agent.exe"
          if (-not (Test-Path $exe)) { throw 'Published GODSEYE.Agent.exe was not created.' }
          $b=[IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'GODSEYE.Agent.exe is not a Windows PE executable.' }
          if ((Get-Item $exe).VersionInfo.FileVersion -notlike "$env:AGENT_VERSION*") { throw 'Compiled version mismatch.' }
      - name: Build x64 WiX MSI
        shell: pwsh
        run: |
          dotnet build 'windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj' -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi=Get-ChildItem 'windows/agent-x64/installer/msi/bin' -Filter 'GODSEYE-Agent-x64.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'WiX did not create GODSEYE-Agent-x64.msi.' }
          Copy-Item $msi.FullName 'windows/agent-x64/GODSEYE-Agent-x64.msi' -Force
          $hash=(Get-FileHash 'windows/agent-x64/GODSEYE-Agent-x64.msi' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content 'windows/agent-x64/GODSEYE-Agent-x64.msi.sha256' $hash -Encoding ascii
          [ordered]@{version=$env:AGENT_VERSION;filename='GODSEYE-Agent-x64.msi';sha256=$hash} | ConvertTo-Json | Set-Content 'windows/agent-x64/update-manifest.json' -Encoding utf8
      - name: Smoke-test install service repair uninstall and state preservation
        shell: pwsh
        run: |
          $msi=(Resolve-Path 'windows/agent-x64/GODSEYE-Agent-x64.msi').Path
          $install=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($install.ExitCode -notin 0,3010) { throw "MSI install failed: $($install.ExitCode)" }
          $svc=Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $svc) { throw 'MSI did not create GODSEYEWindowsAgent.' }
          if ($svc.StartMode -ne 'Auto') { throw "Service is not Automatic: $($svc.StartMode)" }
          if ($svc.StartName -ne 'LocalSystem') { throw "Service is not LocalSystem: $($svc.StartName)" }
          if ($svc.PathName -notmatch 'GODSEYE.Agent.exe') { throw "Wrong service executable: $($svc.PathName)" }
          if (-not (Test-Path 'C:\Program Files\GODSEYE Agent\GODSEYE.Agent.exe')) { throw 'Permanent binary missing.' }
          $sentinel='C:\ProgramData\GODSEYE\Agent\ci-preserve-test.txt'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content $sentinel 'preserve-me' -Encoding ascii
          $repair=Start-Process msiexec.exe -ArgumentList @('/fa',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($repair.ExitCode -notin 0,3010) { throw "MSI repair failed: $($repair.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Repair removed persistent state.' }
          $uninstall=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin 0,3010) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          if (Get-Service GODSEYEWindowsAgent -ErrorAction SilentlyContinue) { throw 'Service remains after uninstall.' }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall removed persistent ProgramData state.' }
          Remove-Item $sentinel -Force
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing.' }
      - name: Build guided first-install Setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows/agent-x64/installer/GODSEYE-Agent-x64.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'windows/agent-x64/publish/GODSEYE.Agent.exe' 'windows/agent-x64/GODSEYE.Agent.exe' -Force
          Copy-Item 'windows/agent-x64/installer/output/GODSEYE-Agent-x64-Setup.exe' 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe' -Force
          $hash=(Get-FileHash 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe.sha256' $hash -Encoding ascii
      - name: Upload verified standalone agent
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Agent-x64-${{ env.AGENT_VERSION }}
          path: |
            windows/agent-x64/GODSEYE.Agent.exe
            windows/agent-x64/GODSEYE-Agent-x64.msi
            windows/agent-x64/GODSEYE-Agent-x64.msi.sha256
            windows/agent-x64/update-manifest.json
            windows/agent-x64/GODSEYE-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Agent-x64-Setup.exe.sha256
      - name: Replace repository agent packages
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f windows/agent-x64/GODSEYE.Agent.exe windows/agent-x64/GODSEYE-Agent-x64.msi windows/agent-x64/GODSEYE-Agent-x64.msi.sha256 windows/agent-x64/update-manifest.json windows/agent-x64/GODSEYE-Agent-x64-Setup.exe windows/agent-x64/GODSEYE-Agent-x64-Setup.exe.sha256
          if (git diff --cached --quiet) { Write-Host 'Generated packages are current.'; exit 0 }
          git commit -m "Build GODSEYE Agent $env:AGENT_VERSION x64 packages [skip ci]"
          git push origin HEAD:main
