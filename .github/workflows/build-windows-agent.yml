name: Build GODSEYE Windows Agent x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
      - 'windows/agent-x64/tests/**'
      - 'windows/agent-x64/prepare-edr-engine.ps1'
      - 'install.sh'
      - 'doctor.sh'
      - 'app/main.py'
      - 'docs/screenshots/v431-godseye-edr-defender-guide.png'
  pull_request:
    paths:
      - '.github/workflows/build-windows-agent.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
      - 'windows/agent-x64/tests/**'
      - 'windows/agent-x64/prepare-edr-engine.ps1'
      - 'install.sh'
      - 'doctor.sh'

# This workflow builds and validates the latest Windows Agent artifacts after
# source changes, then publishes the verified packages as release assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained x64 Agent 2.4.5
        shell: pwsh
        run: |
          $project = 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $publish = 'windows/agent-x64/publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          dotnet publish $project -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $agent = Join-Path $publish 'GODSEYE.Agent.exe'
          if (-not (Test-Path $agent)) { throw 'Published GODSEYE.Agent.exe was not created.' }
          $fileVersion = (Get-Item $agent).VersionInfo.FileVersion
          if ($fileVersion -notlike '2.4.5*') { throw "Unexpected Agent file version: $fileVersion" }

      - name: Stage verified optional YARA-X engine
        shell: pwsh
        run: |
          & 'windows/agent-x64/prepare-edr-engine.ps1'
          if (-not (Test-Path 'windows/agent-x64/publish/EDR/yr.exe')) { throw 'YARA-X scanner was not staged.' }

      - name: Build x64 MSI package
        shell: pwsh
        run: |
          $project = 'windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj'
          dotnet build $project -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $msi = Get-ChildItem 'windows/agent-x64/installer/msi/bin' -Filter 'GODSEYE-Windows-Agent-x64.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'WiX did not create GODSEYE-Windows-Agent-x64.msi.' }
          Copy-Item $msi.FullName 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi' -Force

          $msiHash = (Get-FileHash 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256' -Value $msiHash -Encoding ascii

          [xml]$projectXml = Get-Content 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $agentVersion = [string]$projectXml.Project.PropertyGroup.Version
          if ($agentVersion -ne '2.4.5') { throw "Expected Agent 2.4.5, found '$agentVersion'." }
          $manifest = [ordered]@{
            status = 'ready'
            version = $agentVersion
            filename = 'GODSEYE-Windows-Agent-x64.msi'
            sha256 = $msiHash
          } | ConvertTo-Json
          Set-Content -Path 'windows/agent-x64/update-manifest.json' -Value $manifest -Encoding utf8

      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'godseye-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'godseye-msi-uninstall.log'

          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if (($install.ExitCode -ne 0) -and ($install.ExitCode -ne 3010)) {
            Get-Content $installLog -Tail 200 -ErrorAction SilentlyContinue
            throw "MSI install failed with exit code $($install.ExitCode)."
          }

          $service = Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $service) { throw 'MSI did not create the GODSEYEWindowsAgent service.' }
          if ($service.StartMode -ne 'Auto') { throw "Service start mode is '$($service.StartMode)', expected Auto." }
          if ($service.StartName -ne 'LocalSystem') { throw "Service account is '$($service.StartName)', expected LocalSystem." }
          if ($service.PathName -notlike '*\GODSEYE Agent\GODSEYE.Agent.exe*') {
            throw "Service executable path is unexpected: $($service.PathName)"
          }
          $trayRun = Get-ItemPropertyValue 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'GODSEYE Windows Agent Tray' -ErrorAction Stop
          if ($trayRun -ne ('"' + (Join-Path $env:ProgramFiles 'GODSEYE Agent\GODSEYE.Agent.exe') + '" --tray')) {
            throw "Windows sign-in tray startup command is unexpected: $trayRun"
          }
          $yr = Join-Path $env:ProgramFiles 'GODSEYE Agent\EDR\yr.exe'
          if (Test-Path $yr) { throw 'Default core-only install unexpectedly included the optional EDR scanner.' }

          $sentinel = Join-Path $env:ProgramData 'GODSEYE\Agent\ci-preserve-test.txt'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content -Path $sentinel -Value 'preserve-me' -Encoding ascii

          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") -Wait -PassThru
          if (($uninstall.ExitCode -ne 0) -and ($uninstall.ExitCode -ne 3010)) {
            Get-Content $uninstallLog -Tail 200 -ErrorAction SilentlyContinue
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)."
          }
          for ($i = 0; $i -lt 10; $i++) {
            if (-not (Get-Service -Name 'GODSEYEWindowsAgent' -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          if (Get-Service -Name 'GODSEYEWindowsAgent' -ErrorAction SilentlyContinue) { throw 'Agent service still exists after uninstall.' }
          $trayAfterRemove = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'GODSEYE Windows Agent Tray' -ErrorAction Ignore
          if ($trayAfterRemove) { throw 'Tray sign-in startup remains registered after uninstall.' }
          if (-not (Test-Path $sentinel)) { throw 'ProgramData state was removed; enrollment/state must survive upgrade/uninstall.' }
          Remove-Item $sentinel -Force

          $edrInstall = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", 'ADDLOCAL=MainFeature,EdrFeature', '/qn', '/norestart') -Wait -PassThru
          if ($edrInstall.ExitCode -notin @(0,3010)) { throw "Optional EDR install failed with code $($edrInstall.ExitCode)." }
          if (-not (Test-Path $yr)) { throw 'Optional EDR install did not include yr.exe.' }
          & $yr --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged YARA-X scanner did not start.' }
          $rule = Join-Path $env:RUNNER_TEMP 'godseye-edr-ci.yar'
          $sample = Join-Path $env:RUNNER_TEMP 'godseye-edr-ci.txt'
          Set-Content -Path $rule -Value 'rule godseye_ci { strings: $marker = "GODSEYE_EDR_CI" condition: $marker }' -Encoding ascii
          Set-Content -Path $sample -Value 'GODSEYE_EDR_CI' -Encoding ascii
          & $yr compile --output (Join-Path $env:RUNNER_TEMP 'godseye-edr-ci.yarc') $rule
          if ($LASTEXITCODE -ne 0) { throw 'Packaged YARA-X could not compile a known-good rule.' }
          $scanResult = & $yr scan $rule $sample
          if ($LASTEXITCODE -ne 0 -or ($scanResult -join ' ') -notmatch 'godseye_ci') { throw 'Packaged YARA-X scan did not detect the CI test marker.' }
          $edrUninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($edrUninstall.ExitCode -notin @(0,3010)) { throw "Optional EDR uninstall failed with code $($edrUninstall.ExitCode)." }

      - name: Smoke-test published 2.4.5 to integrated 2.4.5
        shell: pwsh
        run: |
          $oldMsi = Join-Path $env:RUNNER_TEMP 'GODSEYE-Windows-Agent-x64-2.4.5.msi'
          $newMsi = (Resolve-Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi').Path
          $oldUrl = 'https://github.com/msapgroup/Godseye/releases/download/v4.31.0-agent-2.4.5/GODSEYE-Windows-Agent-x64.msi'
          Invoke-WebRequest -Uri $oldUrl -OutFile $oldMsi -TimeoutSec 180
          if ((Get-Item $oldMsi).Length -lt 1000000) { throw 'Agent 2.4.5 MSI download is incomplete.' }
          $oldHash = (Get-FileHash $oldMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          # The release is refreshed in place. Validate its published checksum
          # rather than pinning the retired original MSI after every refresh.
          $checksumFile = Join-Path $env:RUNNER_TEMP 'published-agent-245.sha256'
          Invoke-WebRequest -Uri ($oldUrl + '.sha256') -OutFile $checksumFile -TimeoutSec 60
          $publishedHash = (Get-Content $checksumFile -Raw).Trim().ToLowerInvariant()
          if ($publishedHash -notmatch '^[a-f0-9]{64}$' -or $oldHash -ne $publishedHash) { throw 'Published Agent 2.4.5 prerequisite MSI SHA-256 mismatch.' }

          $oldInstall = Start-Process msiexec.exe -ArgumentList @('/i', "`"$oldMsi`"", '/qn', '/norestart') -PassThru
          if (-not $oldInstall.WaitForExit(180000)) { Stop-Process -Id $oldInstall.Id -Force; throw 'Agent 2.4.5 install timed out.' }
          if (($oldInstall.ExitCode -ne 0) -and ($oldInstall.ExitCode -ne 3010)) { throw "Agent 2.4.5 prerequisite install failed with exit code $($oldInstall.ExitCode)." }
          $installedExe = Join-Path $env:ProgramFiles 'GODSEYE Agent\GODSEYE.Agent.exe'
          $before = (Get-Item $installedExe).VersionInfo.FileVersion
          if ($before -notlike '2.4.5*') { throw "Upgrade test expected 2.4.5 before upgrade, found '$before'." }

          $upgrade = Start-Process msiexec.exe -ArgumentList @('/i', "`"$newMsi`"", '/qn', '/norestart') -PassThru
          if (-not $upgrade.WaitForExit(180000)) { Stop-Process -Id $upgrade.Id -Force; throw 'Agent 2.4.5 upgrade timed out.' }
          if (($upgrade.ExitCode -ne 0) -and ($upgrade.ExitCode -ne 3010)) { throw "Agent 2.4.5 upgrade failed with exit code $($upgrade.ExitCode)." }
          $after = (Get-Item $installedExe).VersionInfo.FileVersion
          if ($after -notlike '2.4.5*') { throw "Agent upgrade left version '$after' installed instead of 2.4.5." }

          $display = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq 'GODSEYE Windows Agent' |
            Select-Object -First 1 -ExpandProperty DisplayVersion
          if ($display -ne '2.4.5') { throw "Windows installed-app version is '$display', expected 2.4.5." }
          $trayAfterUpgrade = Get-ItemPropertyValue 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'GODSEYE Windows Agent Tray' -ErrorAction Stop
          if ($trayAfterUpgrade -notlike '*GODSEYE.Agent.exe" --tray') { throw 'Upgrade did not register per-user tray startup.' }

          Write-Host 'Uninstalling upgraded Agent 2.4.5.'
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$newMsi`"", '/qn', '/norestart') -PassThru
          if (-not $uninstall.WaitForExit(180000)) { Stop-Process -Id $uninstall.Id -Force; throw 'Agent uninstall after upgrade timed out.' }
          if (($uninstall.ExitCode -ne 0) -and ($uninstall.ExitCode -ne 3010)) { throw "Post-upgrade uninstall failed with exit code $($uninstall.ExitCode)." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found.' }

      - name: Build guided Setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'windows/agent-x64/installer/GODSEYE-Agent-x64.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $agent = 'windows/agent-x64/publish/GODSEYE.Agent.exe'
          $setup = 'windows/agent-x64/installer/output/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe'
          if (-not (Test-Path $setup)) { throw 'Inno Setup did not create the guided setup EXE.' }
          $setupVersion = (Get-Item $setup).VersionInfo.ProductVersion
          if ($setupVersion -notlike '2.4.5*') { throw "Guided Setup version is '$setupVersion', expected 2.4.5." }
          Copy-Item $agent 'windows/agent-x64/GODSEYE.Agent.exe' -Force
          Copy-Item $setup 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe' -Force
          Copy-Item $setup 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe' -Force
          $hash = (Get-FileHash 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256' -Value $hash -Encoding ascii
          Set-Content -Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe.sha256' -Value $hash -Encoding ascii

      - name: Verify guided Setup EDR choices for new and enrolled computers
        shell: pwsh
        run: |
          & 'windows/agent-x64/tests/setup-ui-smoke.ps1' -SetupPath 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe'

      - name: Upload actual Setup EDR screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Agent-2.4.5-Setup-EDR-screens
          path: ${{ runner.temp }}/godseye-setup-edr-*.png
          if-no-files-found: ignore

      - name: Build GODSEYE v4.31.0 source + Agent candidate ZIP
        shell: pwsh
        run: |
          $zip = 'GODSEYE-v4.31.0-with-agent.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'godseye-source.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'godseye-v431'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if ((Get-Content VERSION -Raw).Trim() -ne '4.31.0') { throw 'VERSION is not 4.31.0.' }

          git archive --format=zip --output=$archive HEAD
          Expand-Archive -Path $archive -DestinationPath $stage -Force
          $legacy = Join-Path $stage 'windows/agent'
          if (Test-Path $legacy) {
            if (Get-ChildItem $legacy -File -Recurse) { throw 'Legacy Windows Agent files must not ship in the full package.' }
            Remove-Item $legacy -Recurse -Force
          }
          # Normalize staged shell scripts so Bash installers never contain CRLF.
          foreach ($script in @('install.sh','doctor.sh')) {
            $scriptPath = Join-Path $stage $script
            if (Test-Path $scriptPath) {
              $scriptText = [System.IO.File]::ReadAllText($scriptPath) -replace ([char]13+[char]10), ([char]10)
              [System.IO.File]::WriteAllText($scriptPath, $scriptText, [System.Text.UTF8Encoding]::new($false))
            }
          }
          @(
            'GODSEYE.Agent.exe',
            'GODSEYE-Windows-Agent-x64.msi',
            'GODSEYE-Windows-Agent-x64.msi.sha256',
            'update-manifest.json',
            'GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe',
            'GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe.sha256',
            'GODSEYE-Windows-Agent-x64-Setup.exe',
            'GODSEYE-Windows-Agent-x64-Setup.exe.sha256'
          ) | ForEach-Object {
            Copy-Item (Join-Path 'windows/agent-x64' $_) (Join-Path $stage 'windows/agent-x64' $_) -Force
          }
          $stagedMsi = Join-Path $stage 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi'
          $stagedManifest = Get-Content (Join-Path $stage 'windows/agent-x64/update-manifest.json') -Raw | ConvertFrom-Json
          if ($stagedManifest.sha256 -ne (Get-FileHash $stagedMsi -Algorithm SHA256).Hash) { throw 'Full package Agent manifest does not match its MSI.' }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -Path "$zip.sha256" -Value $zipHash -Encoding ascii

      - name: Upload integrated Windows Agent 2.4.5 packages
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Windows-Agent-x64-2.4.5-integrated
          path: |
            windows/agent-x64/GODSEYE.Agent.exe
            windows/agent-x64/publish/GODSEYE.Agent.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
            windows/agent-x64/update-manifest.json
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe.sha256
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256

      - name: Upload GODSEYE v4.31.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-v4.31.0-with-agent
          path: |
            GODSEYE-v4.31.0-with-agent.zip
            GODSEYE-v4.31.0-with-agent.zip.sha256

      - name: Point the 2.4.5 release tag at this validated build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git tag -f v4.31.0-agent-2.4.5 $env:GITHUB_SHA
          git push --force origin refs/tags/v4.31.0-agent-2.4.5

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.31.0-agent-2.4.5
          name: GODSEYE v4.31.0 Windows Agent 2.4.5
          body: |
            GODSEYE v4.31.0 with Agent 2.4.5 integrating EDR, Cyber Tools, and consent-based Remote Access.

            Includes the guided Windows installer, MSI, agent executable, checksums, and full source candidate ZIP.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            windows/agent-x64/GODSEYE.Agent.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup-2.4.5.exe.sha256
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256
            windows/agent-x64/update-manifest.json
            GODSEYE-v4.31.0-with-agent.zip
            GODSEYE-v4.31.0-with-agent.zip.sha256
