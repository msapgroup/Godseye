name: Apply Windows Agent Self Update Patch

on:
  push:
    branches:
      - feature/windows-agent-self-update
    paths:
      - '.github/scripts/apply_windows_agent_self_update.py'
      - '.github/workflows/apply-windows-agent-self-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/windows-agent-self-update
      - name: Apply patch
        run: python -c "import json,runpy; runpy.run_path('.github/scripts/apply_windows_agent_self_update.py', init_globals={'json': json})"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/windows_agent.py windows/agent-x64 .github/workflows/build-windows-agent.yml tests
          git commit -m 'Add Windows Agent check and self-update support'
          git push origin HEAD:feature/windows-agent-self-update
