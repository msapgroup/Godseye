name: GODSEYE release tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Validate release package contract
        run: python scripts/validate_release.py .
      - name: Python compile
        run: python -m compileall app
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n doctor.sh
          bash -n godseye-apply-update
          bash -n godseye-https-setup
          bash -n godseye-release-audit
      - name: Test suite
        run: PYTHONPATH=. PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
