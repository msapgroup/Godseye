name: GODSEYE full server-side audit
on: [push, pull_request]
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile server code
        run: python -m compileall -q app
      - name: Run authenticated server regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_server_regression_20261104.py tests/test_crm_workflow.py::test_real_login_can_save_customer_with_form_values
      - name: Run all server-side tests (exclude Windows agent test modules)
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import pytest
          all_tests = sorted(Path("tests").glob("test_*.py"))
          server_tests = [str(p) for p in all_tests if "agent" not in p.name.lower() and "installer" not in p.name.lower()]
          print(f"Server test files: {len(server_tests)} / {len(all_tests)}", flush=True)
          print("\n".join(server_tests), flush=True)
          raise SystemExit(pytest.main(["-q", *server_tests]))
          PY
