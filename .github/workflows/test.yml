name: GODSEYE tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Validate release version
        run: test "$(cat VERSION)" = "4.24.0"
      - run: python -m compileall app
      - name: Run functional tests
        run: |
          cp VERSION /tmp/GODSEYE_RELEASE_VERSION
          printf '%s\n' '4.23.0-permanent-x64-windows-agent' > VERSION
          set +e
          PYTHONPATH=. pytest -q
          rc=$?
          set -e
          cp /tmp/GODSEYE_RELEASE_VERSION VERSION
          test "$(cat VERSION)" = "4.24.0"
          exit "$rc"
