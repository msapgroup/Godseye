name: Build GODSEYE v4.26 Remote Access Fix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
      - '.github/scripts/apply_remote_v2_transport.py'
      - '.github/workflows/build-v426-remote-fix.yml'
  push:
    branches: [main]
    paths:
      - 'windows/agent-x64/src/**'
      - '.github/scripts/apply_remote_v2_transport.py'
      - '.github/workflows/build-v426-remote-fix.yml'

permissions:
  contents: write

jobs:
  windows-remote-access:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}

      - name: Apply remote support v2 transport
        shell: pwsh
        run: python .github/scripts/apply_remote_v2_transport.py

      - name: Contract checks
        shell: pwsh
        run: |
          $core=Get-Content 'windows/agent-x64/src/Godseye.WindowsAgent/GodseyeAgentService.cs' -Raw
          $v2=Get-Content 'windows/agent-x64/src/Godseye.WindowsAgent/RemoteSupportV2.cs' -Raw
          if ($core -notmatch 'partial class GodseyeAgentService') { throw 'Agent class is not partial' }
          if ($core -notmatch '--remote-helper-v2') { throw 'Remote helper v2 dispatch missing' }
          if ($core -notmatch 'StartRemoteSessionV2') { throw 'Remote session v2 dispatch missing' }
          if ($v2 -notmatch 'TcpListener\(IPAddress.Loopback') { throw 'Loopback-only transport missing' }
          if ($v2 -notmatch 'RandomNumberGenerator.GetBytes\(32\)') { throw 'Session secret missing' }
          if ($v2 -notmatch '"status", "active"') { throw 'Explicit approval-to-active transition missing' }
          if ($v2 -notmatch 'CopyFromScreen') { Write-Host 'Capture remains delegated to hardened existing helper handler.' }

      - name: Publish x64 agent
        shell: pwsh
        run: |
          dotnet publish windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -o windows/agent-x64/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 MSI
        shell: pwsh
        run: |
          dotnet build windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi=Get-ChildItem windows/agent-x64/installer/msi/bin -Filter GODSEYE-Windows-Agent-x64.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI missing' }
          Copy-Item $msi.FullName windows/agent-x64/GODSEYE-Windows-Agent-x64.msi -Force
          $hash=(Get-FileHash windows/agent-x64/GODSEYE-Windows-Agent-x64.msi -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256 $hash -Encoding ascii
          $manifest=[ordered]@{version='2.2.8';filename='GODSEYE-Windows-Agent-x64.msi';sha256=$hash}|ConvertTo-Json
          Set-Content windows/agent-x64/update-manifest.json $manifest -Encoding utf8

      - name: MSI lifecycle smoke test
        shell: pwsh
        run: |
          $msi=(Resolve-Path windows/agent-x64/GODSEYE-Windows-Agent-x64.msi).Path
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "MSI install failed $($p.ExitCode)" }
          $svc=Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $svc) { throw 'Windows service missing' }
          if ($svc.StartName -ne 'LocalSystem') { throw "Unexpected service account $($svc.StartName)" }
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "MSI uninstall failed $($p.ExitCode)" }

      - name: Install Inno Setup and build guided setup
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc windows/agent-x64/installer/GODSEYE-Agent-x64.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows/agent-x64/publish/GODSEYE.WindowsAgent.exe windows/agent-x64/GODSEYE.WindowsAgent.exe -Force
          Copy-Item windows/agent-x64/installer/output/GODSEYE-Windows-Agent-x64-Setup.exe windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe -Force
          $hash=(Get-FileHash windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256 $hash -Encoding ascii

      - name: Upload fixed Windows agent
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Windows-Agent-x64-2.2.8-remote-fix
          path: |
            windows/agent-x64/GODSEYE.WindowsAgent.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
            windows/agent-x64/update-manifest.json
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256

      - name: Commit patched source and packages on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/agent-x64/src/Godseye.WindowsAgent/GodseyeAgentService.cs
          git add -f windows/agent-x64/GODSEYE.WindowsAgent.exe windows/agent-x64/GODSEYE-Windows-Agent-x64.msi windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256 windows/agent-x64/update-manifest.json windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix remote support transport and build agent 2.2.8 [skip ci]'
            git push origin HEAD:main
          }
