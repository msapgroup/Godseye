name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Windows Agent for C# analysis
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet build windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj -c Release -r win-x64 --self-contained true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
