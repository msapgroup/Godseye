name: Apply Agent 2.2.3 Remote Handoff Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-agent-223-remote-handoff-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/apply_agent_223_remote_handoff_fix.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'CreateProcessWithTokenW' windows/agent-x64/src/Godseye.WindowsAgent/GodseyeAgentService.cs
          grep -q 'WaitForRemoteHelperReady' windows/agent-x64/src/Godseye.WindowsAgent/GodseyeAgentService.cs
          grep -q '<Version>2.2.3</Version>' windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj
      - name: Commit fix
        run: |
          git config user.name 'msapgroup'
          git config user.email '42919953+msapgroup@users.noreply.github.com'
          git add windows/agent-x64/src/Godseye.WindowsAgent/GodseyeAgentService.cs \
                  windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj \
                  windows/agent-x64/installer/msi/Package.wxs \
                  windows/agent-x64/installer/GODSEYE-Agent-x64.iss \
                  tests/test_permanent_x64_windows_agent_v423.py \
                  tests/test_remote_access_v4231.py \
                  tests/test_windows_agent_self_update.py
          git commit -m 'Fix remote helper handoff and bump Agent 2.2.3'
          git push
