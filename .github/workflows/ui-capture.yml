name: Capture GODSEYE UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ui/approved-godseye-redesign
    paths:
      - 'app/**'
      - 'scripts/capture_ui.py'
      - '.github/workflows/ui-capture.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/capture_ui.py'
      - 'scripts/seed_screenshot_data.py'
      - '.github/workflows/ui-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GODSEYE and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start clean GODSEYE instance
        env:
          GODSEYE_DB: /tmp/godseye-ui-capture.db
          GODSEYE_DATA_DIR: /tmp/godseye-ui-master-data
          GODSEYE_COOKIE_SECURE: 'false'
          PORT: '8080'
        run: |
          rm -f /tmp/godseye-ui-capture.db
          PYTHONPATH=. python scripts/seed_screenshot_data.py
          python -m app > /tmp/godseye-ui.log 2>&1 &
          echo $! > /tmp/godseye-ui.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Verify personal dashboard workflows
        run: PYTHONPATH=. python scripts/verify_visual_dashboard.py
      - name: Verify Weather Alerts and dropdown contrast
        run: PYTHONPATH=. python scripts/verify_weather_workspace.py
      - name: Adapt legacy capture selectors for the redesigned Users page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/capture_ui.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "await page.locator('#roleAccessRows .role-access-row').first.wait_for()",
              "await page.locator('#upPermissionRows .up-permission-row').first.wait_for()",
          )
          source = source.replace(
              "await page.get_by_role('button', name='Reset password', exact=True).first.click()",
              "await page.evaluate(\"async () => { const x=(await json('/api/v1/users')).find(u=>u.username==='demo-operator'); if(x) await selectPermissionUser(x.id) }\")\n        await page.get_by_role('button', name='Reset password', exact=True).first.click()",
          )
          path.write_text(source, encoding="utf-8")
          PY
      - name: Capture real running app screens
        run: python scripts/capture_ui.py
      - name: Capture Users & Permissions with approved in-app logo
        run: python scripts/capture_users_permissions.py
      - name: Commit only the refreshed Users & Permissions screenshot to the feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/refined-user-permissions-20261108' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v431-permissions-restore.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(users): replace permissions screenshot from live app"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Show application errors if capture fails
        if: failure()
        run: |
          tail -100 /tmp/godseye-ui.log || true
      - name: Verify screenshot files
        run: |
          test -s docs/screenshots/v431-dashboard-map-logo.png
          test -s docs/screenshots/v431-login.png
          test -s docs/screenshots/v431-devices-guide.png
          test -s docs/screenshots/v431-cyber-tools-overview.png
          test -s docs/screenshots/v431-system-health-guide.png
          test -s docs/screenshots/v431-godseye-edr-defender-guide.png
          test -s docs/screenshots/v431-sites-management.png
          test -s docs/screenshots/v431-permissions-restore.png
          test -s docs/screenshots/godseye-about.png
      - name: Upload refreshed screenshot previews
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-screenshot-previews
          path: docs/screenshots/
          if-no-files-found: error
      - name: Build downloadable source ZIP
        run: |
          git archive --format=zip --output=GODSEYE-redesigned.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-redesigned
          path: GODSEYE-redesigned.zip
          retention-days: 30
