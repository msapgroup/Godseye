name: GODSEYE live UI capture

on:
  workflow_dispatch:
  push:
    branches:
      - ui/approved-godseye-redesign
    paths:
      - 'app/**'
      - 'scripts/seed_screenshot_data.py'
      - 'scripts/capture_live_ui.py'
      - '.github/workflows/ui-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODSEYE_DB: /tmp/godseye-ui-capture.db
      GODSEYE_COOKIE_SECURE: 'false'
      GODSEYE_CAPTURE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GODSEYE and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Seed temporary capture data
        run: PYTHONPATH=. python scripts/seed_screenshot_data.py

      - name: Start GODSEYE
        run: |
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8080 >/tmp/godseye-ui.log 2>&1 &
          echo $! >/tmp/godseye-ui.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/v1/auth/setup/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/godseye-ui.log
          exit 1

      - name: Capture live GODSEYE screens
        run: PYTHONPATH=. python scripts/capture_live_ui.py

      - name: Upload live UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: godseye-live-ui-captures
          path: artifacts/ui-captures/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godseye-live-ui-log
          path: /tmp/godseye-ui.log
          if-no-files-found: ignore
