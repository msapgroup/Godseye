name: Build GODSEYE Production Windows Agent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-agent-production.yml'
      - 'windows/agent-x64/src/**'
      - 'windows/agent-x64/installer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained x64 service
        shell: pwsh
        run: |
          $project='windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj'
          $publish='windows/agent-x64/publish'
          dotnet publish $project -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe=Join-Path $publish 'GODSEYE.WindowsAgent.exe'
          if (-not (Test-Path $exe)) { throw 'x64 service executable was not created.' }

      - name: Build MSI
        shell: pwsh
        run: |
          dotnet build 'windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj' -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi=Get-ChildItem 'windows/agent-x64/installer/msi/bin' -Filter 'GODSEYE-Windows-Agent-x64.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not created.' }
          Copy-Item $msi.FullName 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi' -Force

      - name: Smoke-test MSI install, service registration, state preservation, uninstall
        shell: pwsh
        run: |
          $msi=(Resolve-Path 'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi').Path
          $log=Join-Path $env:RUNNER_TEMP 'godseye-install.log'
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart','/l*v',"`"$log`"") -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { Get-Content $log -Tail 200; throw "MSI install failed: $($p.ExitCode)" }
          $svc=Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $svc) { throw 'Service was not registered.' }
          if ($svc.StartMode -ne 'Auto') { throw 'Service is not Automatic.' }
          if ($svc.StartName -ne 'LocalSystem') { throw 'Service is not LocalSystem.' }
          $sentinel=Join-Path $env:ProgramData 'GODSEYE\Agent\preserve-ci.txt'
          New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
          Set-Content $sentinel 'preserve'
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Get-Service GODSEYEWindowsAgent -ErrorAction SilentlyContinue) { throw 'Service remained after uninstall.' }
          if (-not (Test-Path $sentinel)) { throw 'ProgramData state was removed.' }
          Remove-Item $sentinel -Force

      - name: Build guided x64 Setup EXE
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup unavailable.' }
          & $iscc 'windows/agent-x64/installer/GODSEYE-Agent-x64.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup='windows/agent-x64/installer/output/GODSEYE-Windows-Agent-x64-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Setup EXE was not created.' }
          Copy-Item $setup 'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe' -Force

      - name: Package production artifacts
        shell: pwsh
        run: |
          Copy-Item 'windows/agent-x64/publish/GODSEYE.WindowsAgent.exe' 'windows/agent-x64/GODSEYE.WindowsAgent.exe' -Force
          $files=@('GODSEYE.WindowsAgent.exe','GODSEYE-Windows-Agent-x64.msi','GODSEYE-Windows-Agent-x64-Setup.exe')
          foreach($f in $files){
            $h=(Get-FileHash (Join-Path 'windows/agent-x64' $f) -Algorithm SHA256).Hash.ToUpperInvariant()
            Set-Content (Join-Path 'windows/agent-x64' ($f+'.sha256')) $h -Encoding ascii
          }
          Compress-Archive -Path @(
            'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi',
            'windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256',
            'windows/agent-x64/GODSEYE.WindowsAgent.exe',
            'windows/agent-x64/GODSEYE.WindowsAgent.exe.sha256',
            'windows/agent-x64/README.md'
          ) -DestinationPath 'GODSEYE-Windows-Agent-x64-Production.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Windows-Agent-x64-Production
          path: |
            GODSEYE-Windows-Agent-x64-Production.zip
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Windows-Agent-x64-Setup.exe.sha256
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi
            windows/agent-x64/GODSEYE-Windows-Agent-x64.msi.sha256
