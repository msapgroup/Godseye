name: Build GODSEYE v4.25 Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ["VERSION", "app/**", "tests/**", "install.sh", "windows/agent-x64/**", ".github/workflows/build-v425-release.yml"]

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt pytest httpx
      - run: PYTHONPATH=. .venv/bin/pytest -q
      - run: .venv/bin/python -m compileall -q app
      - run: bash -n install.sh && bash -n godseye-apply-update && bash -n godseye-https-setup && bash -n godseye-release-audit

  windows-agent-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - name: Build x64 agent
        shell: pwsh
        run: dotnet publish windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -o windows/agent-x64/publish
      - name: Build MSI
        shell: pwsh
        run: dotnet build windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj -c Release -p:InstallerPlatform=x64
      - name: MSI install/uninstall smoke test
        shell: pwsh
        run: |
          $msi=(Get-ChildItem windows/agent-x64/installer/msi/bin -Filter GODSEYE-Windows-Agent-x64.msi -Recurse | Select-Object -First 1).FullName
          if (-not $msi) { throw "MSI missing" }
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "MSI install failed $($p.ExitCode)" }
          $svc=Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $svc) { throw "Windows service missing" }
          if ($svc.StartMode -ne 'Auto') { throw "Service not automatic" }
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "MSI uninstall failed $($p.ExitCode)" }
