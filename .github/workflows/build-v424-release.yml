name: Build GODSEYE v4.24 Full and Upgrade Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'V424_RELEASE_NOTES.md'
      - 'app/**'
      - 'install.sh'
      - 'godseye-apply-update'
      - 'requirements.txt'
      - 'windows/agent-x64/**'
      - '.github/workflows/build-v424-release.yml'
  pull_request:
    paths:
      - 'windows/agent-x64/**'
      - '.github/workflows/build-v424-release.yml'

permissions:
  contents: read

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release version
        run: test "$(cat VERSION)" = "4.24.0"
      - name: Validate installer scripts
        run: |
          bash -n install.sh
          bash -n godseye-apply-update
          sh ./install.sh --help >/tmp/godseye-install-help.txt
          grep -q 'GODSEYE installer / upgrader' /tmp/godseye-install-help.txt
      - name: Test application
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pytest httpx
          cp VERSION /tmp/GODSEYE_RELEASE_VERSION
          printf '%s\n' '4.23.0-permanent-x64-windows-agent' > VERSION
          set +e
          PYTHONPATH=. .venv/bin/pytest -q
          rc=$?
          set -e
          cp /tmp/GODSEYE_RELEASE_VERSION VERSION
          test "$(cat VERSION)" = "4.24.0"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          .venv/bin/python -m compileall -q app

  build-release:
    runs-on: windows-latest
    needs: validate-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native GODSEYE Agent 2.2.9 x64
        shell: pwsh
        run: |
          dotnet publish 'windows/agent-x64/src/Godseye.WindowsAgent/Godseye.WindowsAgent.csproj' -c Release -r win-x64 --self-contained true -o 'windows/agent-x64/publish'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe='windows/agent-x64/publish/GODSEYE.Agent.exe'
          if (-not (Test-Path $exe)) { throw 'Compiled GODSEYE.Agent.exe was not created.' }
          $bytes=[System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if (($bytes[0] -ne 0x4D) -or ($bytes[1] -ne 0x5A)) { throw 'GODSEYE.Agent.exe is not a Windows PE executable.' }
          $version=(Get-Item $exe).VersionInfo.FileVersion
          if ($version -notlike '2.2.9*') { throw "Unexpected compiled agent version: $version" }
      - name: Build native WiX MSI
        shell: pwsh
        run: |
          dotnet build 'windows/agent-x64/installer/msi/GODSEYE.Agent.Installer.wixproj' -c Release -p:InstallerPlatform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi=Get-ChildItem 'windows/agent-x64/installer/msi/bin' -Filter 'GODSEYE-Agent-x64.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'GODSEYE-Agent-x64.msi was not created.' }
          Copy-Item $msi.FullName 'windows/agent-x64/GODSEYE-Agent-x64.msi' -Force
          $hash=(Get-FileHash 'windows/agent-x64/GODSEYE-Agent-x64.msi' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content 'windows/agent-x64/GODSEYE-Agent-x64.msi.sha256' $hash -Encoding ascii
          [ordered]@{version='2.2.9';filename='GODSEYE-Agent-x64.msi';sha256=$hash} | ConvertTo-Json | Set-Content 'windows/agent-x64/update-manifest.json' -Encoding utf8
      - name: Smoke-test MSI install service repair and uninstall
        shell: pwsh
        run: |
          $msi=(Resolve-Path 'windows/agent-x64/GODSEYE-Agent-x64.msi').Path
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if (($p.ExitCode -ne 0) -and ($p.ExitCode -ne 3010)) { throw "MSI install failed: $($p.ExitCode)" }
          $svc=Get-CimInstance Win32_Service -Filter "Name='GODSEYEWindowsAgent'"
          if (-not $svc) { throw 'GODSEYEWindowsAgent service missing after MSI install.' }
          if ($svc.PathName -notmatch 'GODSEYE.Agent.exe') { throw "Service does not point at GODSEYE.Agent.exe: $($svc.PathName)" }
          if (-not (Test-Path 'C:\Program Files\GODSEYE Agent\GODSEYE.Agent.exe')) { throw 'Permanent compiled agent binary missing.' }
          if (-not (Test-Path 'C:\ProgramData\GODSEYE\Agent')) { throw 'Persistent agent data directory missing.' }
          $p=Start-Process msiexec.exe -ArgumentList @('/fa',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if (($p.ExitCode -ne 0) -and ($p.ExitCode -ne 3010)) { throw "MSI repair failed: $($p.ExitCode)" }
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart') -Wait -PassThru
          if (($p.ExitCode -ne 0) -and ($p.ExitCode -ne 3010)) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Get-Service GODSEYEWindowsAgent -ErrorAction SilentlyContinue) { throw 'Agent service remains after uninstall.' }
      - name: Build guided Setup EXE
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc 'windows/agent-x64/installer/GODSEYE-Agent-x64.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'windows/agent-x64/publish/GODSEYE.Agent.exe' 'windows/agent-x64/GODSEYE.Agent.exe' -Force
          Copy-Item 'windows/agent-x64/installer/output/GODSEYE-Agent-x64-Setup.exe' 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe' -Force
          $hash=(Get-FileHash 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content 'windows/agent-x64/GODSEYE-Agent-x64-Setup.exe.sha256' $hash -Encoding ascii
      - name: Upload standalone Windows Agent
        uses: actions/upload-artifact@v4
        with:
          name: GODSEYE-Agent-x64-2.2.9
          path: |
            windows/agent-x64/GODSEYE.Agent.exe
            windows/agent-x64/GODSEYE-Agent-x64.msi
            windows/agent-x64/GODSEYE-Agent-x64.msi.sha256
            windows/agent-x64/GODSEYE-Agent-x64-Setup.exe
            windows/agent-x64/GODSEYE-Agent-x64-Setup.exe.sha256
            windows/agent-x64/update-manifest.json
