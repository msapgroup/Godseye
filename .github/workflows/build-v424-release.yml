name: Build GODSEYE v4.24 Full and Upgrade Release

# Historical v4.24 rebuild workflow. Kept manual-only so newer server/agent
# development does not trigger a release job that requires VERSION=4.24.0.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard historical release
        run: |
          test "$(cat VERSION)" = "4.24.0" || {
            echo 'This historical workflow can only rebuild a 4.24.0 ref.'
            exit 1
          }
          bash -n install.sh
          bash -n godseye-apply-update
