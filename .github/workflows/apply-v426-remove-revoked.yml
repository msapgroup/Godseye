name: Apply v4.26 revoked computer removal
on:
  push:
    branches: [feature/v426-remove-revoked-computers]
    paths: ['.github/workflows/apply-v426-remove-revoked.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v426-remove-revoked-computers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_v426_remove_revoked.py
      - name: Verify syntax and contract
        run: |
          python -m py_compile app/main.py
          python -m pip install -q pytest
          pytest -q tests/test_v426_remove_revoked_computers.py
      - name: Commit final source and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_v426_remove_revoked.py .github/workflows/apply-v426-remove-revoked.yml
          git add app/main.py VERSION tests/test_v426_remove_revoked_computers.py
          git commit -m 'Add v4.26 permanent removal for revoked computers'
          git push origin HEAD:feature/v426-remove-revoked-computers
