<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">GODSEYE Windows Defender best-practice setup guide</title>
  <desc id="desc">A dark GODSEYE Cyber Tools guide showing Windows Defender recommended settings and PowerShell setup commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061220"/>
      <stop offset=".55" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#132b4d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102743"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb7ff"/>
      <stop offset="1" stop-color="#76f2b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <style>
      .h1{font:800 44px Inter,Segoe UI,Arial,sans-serif;fill:#f5fbff}
      .h2{font:800 26px Inter,Segoe UI,Arial,sans-serif;fill:#f5fbff}
      .body{font:500 21px Inter,Segoe UI,Arial,sans-serif;fill:#d8e8f5}
      .small{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#9db3c8}
      .tiny{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#b6cadc}
      .mono{font:600 18px Consolas,Menlo,monospace;fill:#d7f4ff}
      .green{fill:#76f2b5}
      .blue{fill:#53c7ff}
      .rim{stroke:#3d85b9;stroke-width:2.5;fill:url(#card)}
      .check{stroke:#76f2b5;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .warn{fill:#f6d85e}
    </style>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <circle cx="1135" cy="95" r="215" fill="#123a5d" opacity=".26"/>
  <circle cx="115" cy="725" r="270" fill="#0f7ab8" opacity=".12"/>

  <text x="70" y="82" class="h1">Windows Defender Best-Practice Setup</text>
  <text x="72" y="120" class="body">Harden Microsoft Defender, then use GODSEYE Cyber Tools to review, scan, and confirm cleanup.</text>

  <g transform="translate(70 166)" filter="url(#shadow)">
    <rect width="430" height="484" rx="18" class="rim"/>
    <rect x="28" y="30" width="62" height="62" rx="14" fill="#123b60" stroke="#3bb7ff" stroke-width="2"/>
    <path d="M59 47 80 57v17c0 15-9 25-21 29-12-4-21-14-21-29V57Z" fill="none" stroke="#9fe8ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="m48 74 8 8 16-22" class="check"/>
    <text x="108" y="55" class="h2">Defender Response</text>
    <text x="108" y="80" class="small">Review protection, run scans,</text>
    <text x="108" y="104" class="small">and confirm threat cleanup.</text>
    <rect x="28" y="132" width="374" height="58" rx="13" fill="#0a2034" stroke="#5798c9" stroke-width="2"/>
    <text x="48" y="168" class="body">PC: LAW-FL-WS-04</text>
    <g transform="translate(28 224)">
      <rect width="118" height="48" rx="10" fill="#123f65" stroke="#4fc0ff"/>
      <text x="24" y="31" class="tiny">Review threats</text>
      <rect x="132" width="98" height="48" rx="10" fill="#123f65" stroke="#4fc0ff"/>
      <text x="154" y="31" class="tiny">Quick scan</text>
      <rect x="244" width="130" height="48" rx="10" fill="#431b22" stroke="#e06373"/>
      <text x="270" y="31" class="tiny">Remove threats</text>
    </g>
    <rect x="28" y="316" width="374" height="132" rx="12" fill="#061827" stroke="#214d6c"/>
    <text x="48" y="348" class="small">Recommended before using this card:</text>
    <path d="M50 380l8 8 18-24" class="check"/>
    <text x="86" y="385" class="small">Real-time and cloud protection on</text>
    <path d="M50 414l8 8 18-24" class="check"/>
    <text x="86" y="419" class="small">Tamper protection enabled</text>
  </g>

  <g transform="translate(540 166)" filter="url(#shadow)">
    <rect width="670" height="484" rx="18" fill="#071827" stroke="#3d85b9" stroke-width="2.5"/>
    <text x="34" y="48" class="h2">Best-Practice Checklist</text>
    <text x="34" y="82" class="small">Run PowerShell as Administrator on each managed Windows computer.</text>

    <g transform="translate(34 116)">
      <circle cx="15" cy="15" r="15" fill="url(#accent)"/>
      <text x="10" y="21" style="font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#061220">1</text>
      <text x="48" y="22" class="body">Confirm Defender is active and updated</text>
      <rect x="48" y="38" width="560" height="82" rx="10" fill="#020b14" stroke="#244761"/>
      <text x="70" y="68" class="mono">Get-MpComputerStatus</text>
      <text x="70" y="98" class="mono">Update-MpSignature</text>
    </g>

    <g transform="translate(34 244)">
      <circle cx="15" cy="15" r="15" fill="url(#accent)"/>
      <text x="9" y="21" style="font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#061220">2</text>
      <text x="48" y="22" class="body">Enable cloud protection and sample review</text>
      <rect x="48" y="38" width="560" height="82" rx="10" fill="#020b14" stroke="#244761"/>
      <text x="70" y="68" class="mono">Set-MpPreference -MAPSReporting Advanced</text>
      <text x="70" y="98" class="mono">Set-MpPreference -SubmitSamplesConsent SendSafeSamples</text>
    </g>

    <g transform="translate(34 372)">
      <circle cx="15" cy="15" r="15" fill="url(#accent)"/>
      <text x="9" y="21" style="font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#061220">3</text>
      <text x="48" y="22" class="body">Reduce ransomware risk</text>
      <rect x="48" y="38" width="560" height="56" rx="10" fill="#020b14" stroke="#244761"/>
      <text x="70" y="73" class="mono">Set-MpPreference -EnableControlledFolderAccess Enabled</text>
    </g>
  </g>

  <g transform="translate(70 690)">
    <rect width="1140" height="76" rx="16" fill="#071827" stroke="#2c5d82" stroke-width="2"/>
    <text x="28" y="34" class="body">In GODSEYE: open Cyber Tools → Windows Defender Response.</text>
    <text x="28" y="62" class="body">Select the enrolled PC, then use Review threats, Quick scan, or admin-confirmed Remove threats.</text>
  </g>
</svg>
