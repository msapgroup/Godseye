<g transform="translate(895 423)"><rect width="641" height="242" rx="15" fill="url(#card2)" stroke="#2d506c"/><text x="22" y="36" class="h2">What happens after a run</text><circle cx="38" cy="82" r="16" fill="#0d74f5"/><text x="38" y="87" text-anchor="middle" class="body">1</text><text x="67" y="86" class="body">The bounded engine runs and stores structured evidence.</text><circle cx="38" cy="128" r="16" fill="#0d74f5"/><text x="38" y="133" text-anchor="middle" class="body">2</text><text x="67" y="132" class="body">Create Finding moves the result into the Findings workflow.</text><circle cx="38" cy="174" r="16" fill="#0d74f5"/><text x="38" y="179" text-anchor="middle" class="body">3</text><text x="67" y="178" class="body">Create Ticket links work, notes, scheduling, and closure.</text><circle cx="38" cy="220" r="16" fill="#0d74f5"/><text x="38" y="225" text-anchor="middle" class="body">4</text><text x="67" y="224" class="body">Export JSON preserves the original scan report.</text></g>
