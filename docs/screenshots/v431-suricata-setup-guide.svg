<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">GODSEYE Network Threat Detection setup guide</title>
  <desc id="desc">A dark GODSEYE setup guide showing the Network Threat Detection card and Suricata install commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061220"/>
      <stop offset=".55" stop-color="#0a1d32"/>
      <stop offset="1" stop-color="#102949"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102743"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb7ff"/>
      <stop offset="1" stop-color="#76f2b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <style>
      .small{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#91a8bf}
      .body{font:500 22px Inter,Segoe UI,Arial,sans-serif;fill:#d8e8f5}
      .h1{font:800 46px Inter,Segoe UI,Arial,sans-serif;fill:#f5fbff}
      .h2{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#f5fbff}
      .mono{font:600 20px Consolas,Menlo,monospace;fill:#d7f4ff}
      .green{fill:#76f2b5}
      .blue{fill:#53c7ff}
      .muted{fill:#8ea3b8}
      .line{stroke:#315a7c;stroke-width:2}
      .rim{stroke:#3d85b9;stroke-width:2.5;fill:url(#card)}
      .step{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#061220}
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="1130" cy="80" r="210" fill="#123a5d" opacity=".28"/>
  <circle cx="110" cy="690" r="260" fill="#0f7ab8" opacity=".12"/>

  <text x="70" y="86" class="h1">Network Threat Detection Setup</text>
  <text x="72" y="124" class="body">Install Suricata first, then connect the alert log to this Cyber Tools card.</text>

  <g transform="translate(70 170)" filter="url(#shadow)">
    <rect width="470" height="430" rx="18" class="rim"/>
    <rect x="28" y="30" width="62" height="62" rx="14" fill="#123b60" stroke="#3bb7ff" stroke-width="2"/>
    <path d="M45 60h29M52 48v28M66 48v28M48 70l10 10 18-26" fill="none" stroke="#9fe8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="55" style="font:800 25px Inter,Segoe UI,Arial,sans-serif;fill:#f5fbff">Network Threat Detection</text>
    <text x="108" y="80" class="small">Review recent Suricata alerts</text>
    <text x="108" y="104" class="small">from the network sensor.</text>
    <rect x="28" y="112" width="142" height="30" rx="15" fill="#173f28" stroke="#43d27f"/>
    <text x="48" y="132" style="font:800 11px Inter,Segoe UI,Arial,sans-serif;fill:#f6d85e;letter-spacing:1.2px">SETUP REQUIRED</text>
    <text x="28" y="174" class="small">History depth</text>
    <rect x="28" y="188" width="416" height="58" rx="14" fill="#0a2034" stroke="#5798c9" stroke-width="2"/>
    <text x="48" y="224" class="body">100 alerts</text>
    <path d="M414 210l12 12 12-12" fill="none" stroke="#d9f3ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="28" y="300" width="126" height="52" rx="10" fill="#123f65" stroke="#4fc0ff"/>
    <text x="52" y="333" class="small" fill="#e7f7ff">Review alerts</text>
    <rect x="168" y="300" width="102" height="52" rx="10" fill="#0a2034" stroke="#4f789f"/>
    <text x="193" y="333" class="small" fill="#e7f7ff">Schedule</text>
    <rect x="28" y="368" width="416" height="44" rx="10" fill="#061827" stroke="#214d6c"/>
    <text x="46" y="396" style="font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#b4c5d6">Ready after GODSEYE can read the Suricata log.</text>
  </g>

  <g transform="translate(590 170)" filter="url(#shadow)">
    <rect width="620" height="430" rx="18" fill="#071827" stroke="#3d85b9" stroke-width="2.5"/>
    <text x="34" y="50" class="h2">Run These Commands</text>
    <text x="34" y="84" class="small">Use the GODSEYE server or the Linux sensor watching the network.</text>

    <g transform="translate(34 118)">
      <circle cx="17" cy="17" r="17" fill="url(#accent)"/>
      <text x="11" y="24" class="step">1</text>
      <text x="52" y="24" class="body">Install Suricata</text>
      <rect x="52" y="44" width="510" height="78" rx="10" fill="#020b14" stroke="#244761"/>
      <text x="76" y="76" class="mono">sudo apt update</text>
      <text x="76" y="106" class="mono">sudo apt install -y suricata</text>
    </g>

    <g transform="translate(34 258)">
      <circle cx="17" cy="17" r="17" fill="url(#accent)"/>
      <text x="10" y="24" class="step">2</text>
      <text x="52" y="24" class="body">Start Suricata and confirm the log</text>
      <rect x="52" y="44" width="510" height="106" rx="10" fill="#020b14" stroke="#244761"/>
      <text x="76" y="76" class="mono">sudo systemctl enable --now suricata</text>
      <text x="76" y="106" class="mono">sudo systemctl status suricata</text>
      <text x="76" y="136" class="mono">sudo ls -l /var/log/suricata/eve.json</text>
    </g>
  </g>

  <g transform="translate(70 626)">
    <rect width="1140" height="70" rx="16" fill="#071827" stroke="#2c5d82" stroke-width="2"/>
    <text x="28" y="34" class="body">In GODSEYE: open Cyber Tools → Network Threat Detection.</text>
    <text x="28" y="59" class="body">Set the log path to </text>
    <text x="230" y="59" class="mono green">/var/log/suricata/eve.json</text>
    <text x="520" y="59" class="body">, then click Review alerts.</text>
  </g>
</svg>
